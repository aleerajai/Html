<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f4dfaa" />
      <stop offset="50%" stop-color="#d4af67" />
      <stop offset="100%" stop-color="#a86443" />
    </linearGradient>
    <linearGradient id="green-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7e8f76" />
      <stop offset="100%" stop-color="#3c4738" />
    </linearGradient>
    <linearGradient id="dark-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141815" />
      <stop offset="100%" stop-color="#0d0d10" />
    </linearGradient>
  </defs>

  <!-- Background Frame -->
  <rect width="100%" height="100%" fill="url(#dark-glow)" rx="16" />
  <rect x="10" y="10" width="380" height="380" fill="none" stroke="rgba(126,143,118,0.12)" stroke-width="1" rx="12" />

  <!-- Diagonal Grid tech elements representing bold motion and creative design -->
  <g opacity="0.15" stroke="#7e8f76" stroke-width="0.5">
    <line x1="0" y1="0" x2="400" y2="400" />
    <line x1="100" y1="0" x2="400" y2="300" />
    <line x1="200" y1="0" x2="400" y2="200" />
    <line x1="0" y1="100" x2="300" y2="400" />
    <line x1="0" y1="200" x2="200" y2="400" />
  </g>

  <!-- Editorial layout block representing "Creative Studio" -->
  <!-- Main image block (abstract aesthetic) -->
  <rect x="60" y="60" width="160" height="200" rx="6" fill="url(#green-gradient)" opacity="0.8" />
  <line x1="75" y1="75" x2="205" y2="245" stroke="rgba(255,255,255,0.15)" stroke-width="1" />
  
  <!-- Stylized luxury graphic sphere inside the main image block -->
  <circle cx="140" cy="160" r="45" fill="none" stroke="#f8f3ea" stroke-width="0.75" opacity="0.3" />
  <circle cx="140" cy="160" r="30" fill="none" stroke="url(#gold)" stroke-width="1.5" opacity="0.8" />

  <!-- Typography elements overlay -->
  <text x="240" y="100" font-family="'Playfair Display', serif" font-size="28" font-weight="bold" fill="#f8f3ea" opacity="0.9">STUDIO</text>
  <text x="240" y="125" font-family="'Playfair Display', serif" font-size="20" font-style="italic" fill="url(#gold)">JOURNAL</text>

  <!-- Body layout simulation -->
  <line x1="240" y1="155" x2="340" y2="155" stroke="rgba(255,255,255,0.4)" stroke-width="4" stroke-linecap="round" />
  <line x1="240" y1="170" x2="320" y2="170" stroke="rgba(255,255,255,0.25)" stroke-width="4" stroke-linecap="round" />
  <line x1="240" y1="185" x2="330" y2="185" stroke="rgba(255,255,255,0.25)" stroke-width="4" stroke-linecap="round" />

  <!-- Floating architectural number badge -->
  <rect x="240" y="210" width="55" height="24" rx="4" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.15)" stroke-width="1" />
  <text x="267" y="226" font-family="'Outfit', sans-serif" font-size="10" font-weight="bold" fill="#7e8f76" text-anchor="middle">VOL. 02</text>
</svg>
