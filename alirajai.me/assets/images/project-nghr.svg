<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="nghr-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12131a" />
      <stop offset="50%" stop-color="#0f1016" />
      <stop offset="100%" stop-color="#090a0e" />
    </linearGradient>
    <linearGradient id="gold-luxury" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5e1a4" />
      <stop offset="50%" stop-color="#d4af67" />
      <stop offset="100%" stop-color="#a86443" />
    </linearGradient>
    <linearGradient id="blue-french" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2c45" />
      <stop offset="100%" stop-color="#111724" />
    </linearGradient>
    <filter id="shadow-nghr" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="600" height="400" fill="url(#nghr-bg)" rx="16"/>
  <rect x="1" y="1" width="598" height="398" fill="none" stroke="rgba(212,175,103,0.18)" stroke-width="1.5" rx="15"/>

  <!-- Elegant Geometric Architecture Elements -->
  <g opacity="0.1" stroke="#d4af67" stroke-width="0.8">
    <circle cx="100" cy="80" r="120" fill="none"/>
    <circle cx="500" cy="320" r="140" fill="none"/>
    <line x1="0" y1="200" x2="600" y2="200" stroke-dasharray="4 6"/>
  </g>

  <!-- Browser Window Frame -->
  <g filter="url(#shadow-nghr)" transform="translate(45, 35)">
    <!-- Main Window Frame -->
    <rect width="510" height="330" rx="12" fill="#13141c" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    
    <!-- Window Bar -->
    <rect width="510" height="36" rx="12" fill="#1a1c27"/>
    <rect y="24" width="510" height="12" fill="#1a1c27"/>
    <circle cx="20" cy="18" r="4.5" fill="#ff5f56"/>
    <circle cx="34" cy="18" r="4.5" fill="#ffbd2e"/>
    <circle cx="48" cy="18" r="4.5" fill="#27c93f"/>

    <!-- URL Bar with French Domain -->
    <rect x="75" y="8" width="250" height="20" rx="10" fill="#0d0e14" stroke="rgba(212,175,103,0.25)" stroke-width="0.8"/>
    <text x="100" y="22" font-family="'Outfit', sans-serif" font-size="10" fill="#aaa39b">https://nghrconsulting.fr</text>
    <circle cx="88" cy="18" r="3.5" fill="#27c93f"/>

    <!-- France Flag & Live Pill -->
    <g transform="translate(390, 8)">
      <rect width="105" height="20" rx="10" fill="rgba(212,175,103,0.12)" stroke="url(#gold-luxury)" stroke-width="1"/>
      <!-- French Tricolor Mini -->
      <rect x="10" y="5" width="4" height="10" fill="#002395"/>
      <rect x="14" y="5" width="4" height="10" fill="#ffffff"/>
      <rect x="18" y="5" width="4" height="10" fill="#ed2939"/>
      <text x="28" y="14" font-family="'Outfit', sans-serif" font-size="9" font-weight="bold" fill="#f8f3ea" letter-spacing="0.5">PARIS, FRANCE</text>
    </g>

    <!-- Header Navigation Mockup -->
    <g transform="translate(25, 52)">
      <text x="0" y="14" font-family="'Playfair Display', serif" font-size="15" font-weight="bold" fill="url(#gold-luxury)">NGHR CONSULTING</text>
      
      <g transform="translate(200, 4)" fill="#aaa39b" font-family="'Outfit', sans-serif" font-size="9">
        <text x="0" y="8">Cabinet RH</text>
        <text x="65" y="8">Expertise</text>
        <text x="125" y="8">Recrutement</text>
        <text x="195" y="8">Contact</text>
      </g>
    </g>

    <!-- Corporate Hero Showcase Mockup -->
    <rect x="25" y="80" width="460" height="115" rx="8" fill="url(#blue-french)" stroke="rgba(212,175,103,0.2)" stroke-width="1"/>
    
    <g transform="translate(45, 105)">
      <rect width="90" height="18" rx="4" fill="rgba(212,175,103,0.15)"/>
      <text x="8" y="12" font-family="'Outfit', sans-serif" font-size="8" font-weight="bold" fill="#d4af67" letter-spacing="1">CABINET DE CONSEIL RH</text>
      
      <text x="0" y="38" font-family="'Playfair Display', serif" font-size="16" font-weight="bold" fill="#f8f3ea">Stratégie & Performance Humaine</text>
      <text x="0" y="54" font-family="'Outfit', sans-serif" font-size="9" fill="#aaa39b">Accompagnement sur-mesure pour dirigeants et organisations en France</text>
      
      <g transform="translate(0, 64)">
        <rect width="115" height="22" rx="11" fill="url(#gold-luxury)"/>
        <text x="57" y="15" font-family="'Outfit', sans-serif" font-size="9" font-weight="bold" fill="#111" text-anchor="middle">Prendre Rendez-vous →</text>
      </g>
    </g>

    <!-- Key Metrics / Pillars Grid -->
    <!-- Pillar 1: Conseil RH -->
    <g transform="translate(25, 210)">
      <rect width="140" height="100" rx="8" fill="#181a24" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
      <circle cx="28" cy="28" r="14" fill="rgba(212,175,103,0.15)"/>
      <text x="28" y="33" font-size="12" text-anchor="middle" fill="#d4af67">👔</text>
      <text x="16" y="60" font-family="'Outfit', sans-serif" font-size="11" font-weight="bold" fill="#f8f3ea">Audit & Conseil</text>
      <text x="16" y="74" font-family="'Outfit', sans-serif" font-size="8.5" fill="#aaa39b">Optimisation des équipes</text>
      <text x="16" y="87" font-family="'Outfit', sans-serif" font-size="8.5" font-weight="bold" fill="#d4af67">Sur Mesure</text>
    </g>

    <!-- Pillar 2: Recrutement Elite -->
    <g transform="translate(185, 210)">
      <rect width="140" height="100" rx="8" fill="#181a24" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
      <circle cx="28" cy="28" r="14" fill="rgba(126,143,118,0.2)"/>
      <text x="28" y="33" font-size="12" text-anchor="middle" fill="#7e8f76">🎯</text>
      <text x="16" y="60" font-family="'Outfit', sans-serif" font-size="11" font-weight="bold" fill="#f8f3ea">Recrutement Cadres</text>
      <text x="16" y="74" font-family="'Outfit', sans-serif" font-size="8.5" fill="#aaa39b">Chasse de tête & talents</text>
      <text x="16" y="87" font-family="'Outfit', sans-serif" font-size="8.5" font-weight="bold" fill="#7e8f76">98% Retention</text>
    </g>

    <!-- Pillar 3: Formation & Coaching -->
    <g transform="translate(345, 210)">
      <rect width="140" height="100" rx="8" fill="#181a24" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
      <circle cx="28" cy="28" r="14" fill="rgba(168,100,67,0.2)"/>
      <text x="28" y="33" font-size="12" text-anchor="middle" fill="#a86443">📈</text>
      <text x="16" y="60" font-family="'Outfit', sans-serif" font-size="11" font-weight="bold" fill="#f8f3ea">Formation & QVT</text>
      <text x="16" y="74" font-family="'Outfit', sans-serif" font-size="8.5" fill="#aaa39b">Développement managérial</text>
      <text x="16" y="87" font-family="'Outfit', sans-serif" font-size="8.5" font-weight="bold" fill="#d4af67">Certifié Qualiopi</text>
    </g>
  </g>
</svg>
