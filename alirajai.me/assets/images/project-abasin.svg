<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="abasin-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161412" />
      <stop offset="50%" stop-color="#100e0d" />
      <stop offset="100%" stop-color="#090807" />
    </linearGradient>
    <linearGradient id="copper-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5e1a4" />
      <stop offset="50%" stop-color="#d4af67" />
      <stop offset="100%" stop-color="#a86443" />
    </linearGradient>
    <filter id="shadow-abasin" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" fill="url(#abasin-bg)" rx="16"/>
  <rect x="1" y="1" width="598" height="398" fill="none" stroke="rgba(168,100,67,0.25)" stroke-width="1.5" rx="15"/>

  <!-- World Globe Grid Lines -->
  <g opacity="0.12" stroke="#a86443" stroke-width="0.8">
    <ellipse cx="300" cy="200" rx="260" ry="140" fill="none"/>
    <ellipse cx="300" cy="200" rx="180" ry="140" fill="none"/>
    <line x1="40" y1="200" x2="560" y2="200"/>
    <line x1="300" y1="40" x2="300" y2="360"/>
  </g>

  <!-- Browser Window Frame -->
  <g filter="url(#shadow-abasin)" transform="translate(45, 35)">
    <!-- Window Frame -->
    <rect width="510" height="330" rx="12" fill="#151311" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    
    <!-- Window Bar -->
    <rect width="510" height="36" rx="12" fill="#1e1a17"/>
    <rect y="24" width="510" height="12" fill="#1e1a17"/>
    <circle cx="20" cy="18" r="4.5" fill="#ff5f56"/>
    <circle cx="34" cy="18" r="4.5" fill="#ffbd2e"/>
    <circle cx="48" cy="18" r="4.5" fill="#27c93f"/>

    <!-- URL Bar -->
    <rect x="75" y="8" width="240" height="20" rx="10" fill="#0d0b0a" stroke="rgba(212,175,103,0.2)" stroke-width="0.8"/>
    <text x="96" y="22" font-family="'Outfit', sans-serif" font-size="10" fill="#aaa39b">https://abasinglobal.com</text>
    <circle cx="86" cy="18" r="3" fill="#27c93f"/>

    <!-- Global Trade Badge -->
    <g transform="translate(385, 8)">
      <rect width="110" height="20" rx="10" fill="rgba(168,100,67,0.2)" stroke="url(#copper-gold)" stroke-width="1"/>
      <circle cx="12" cy="10" r="3" fill="#d4af67"/>
      <text x="22" y="14" font-family="'Outfit', sans-serif" font-size="9" font-weight="bold" fill="#f8f3ea" letter-spacing="0.5">GLOBAL EXPORT</text>
    </g>

    <!-- Header Navigation -->
    <g transform="translate(25, 52)">
      <text x="0" y="14" font-family="'Playfair Display', serif" font-size="15" font-weight="bold" fill="url(#copper-gold)">ABASIN GLOBAL</text>
      
      <g transform="translate(190, 4)" fill="#aaa39b" font-family="'Outfit', sans-serif" font-size="9">
        <text x="0" y="8">Trade Commodities</text>
        <text x="100" y="8">Supply Chain</text>
        <text x="175" y="8">Logistics</text>
        <text x="235" y="8">B2B Portal</text>
      </g>
    </g>

    <!-- Hero Banner inside Mockup -->
    <rect x="25" y="80" width="460" height="115" rx="8" fill="#1b1714" stroke="rgba(212,175,103,0.2)" stroke-width="1"/>
    
    <g transform="translate(45, 105)">
      <text x="0" y="16" font-family="'Outfit', sans-serif" font-size="9" font-weight="bold" fill="#a86443" letter-spacing="1">INTERNATIONAL COMMERCE & SOURCING</text>
      <text x="0" y="42" font-family="'Playfair Display', serif" font-size="17" font-weight="bold" fill="#f8f3ea">Empowering Global B2B Supply Chains</text>
      <text x="0" y="58" font-family="'Outfit', sans-serif" font-size="9.5" fill="#aaa39b">End-to-end trading solutions, bulk commodity procurement & freight connectivity</text>
      
      <g transform="translate(0, 68)">
        <rect width="110" height="22" rx="11" fill="url(#copper-gold)"/>
        <text x="55" y="15" font-family="'Outfit', sans-serif" font-size="9" font-weight="bold" fill="#111" text-anchor="middle">Explore Catalog →</text>
      </g>
    </g>

    <!-- Category Showcase Cards -->
    <!-- Card 1 -->
    <g transform="translate(25, 210)">
      <rect width="140" height="100" rx="8" fill="#1c1815" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
      <circle cx="28" cy="28" r="14" fill="rgba(212,175,103,0.15)"/>
      <text x="28" y="33" font-size="12" text-anchor="middle">📦</text>
      <text x="16" y="60" font-family="'Outfit', sans-serif" font-size="11" font-weight="bold" fill="#f8f3ea">Bulk Commodities</text>
      <text x="16" y="74" font-family="'Outfit', sans-serif" font-size="8.5" fill="#aaa39b">Certified wholesale trade</text>
      <text x="16" y="87" font-family="'Outfit', sans-serif" font-size="8.5" font-weight="bold" fill="#d4af67">Export Quality</text>
    </g>

    <!-- Card 2 -->
    <g transform="translate(185, 210)">
      <rect width="140" height="100" rx="8" fill="#1c1815" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
      <circle cx="28" cy="28" r="14" fill="rgba(168,100,67,0.2)"/>
      <text x="28" y="33" font-size="12" text-anchor="middle">🚢</text>
      <text x="16" y="60" font-family="'Outfit', sans-serif" font-size="11" font-weight="bold" fill="#f8f3ea">Worldwide Freight</text>
      <text x="16" y="74" font-family="'Outfit', sans-serif" font-size="8.5" fill="#aaa39b">Sea & air cargo routing</text>
      <text x="16" y="87" font-family="'Outfit', sans-serif" font-size="8.5" font-weight="bold" fill="#a86443">35+ Countries</text>
    </g>

    <!-- Card 3 -->
    <g transform="translate(345, 210)">
      <rect width="140" height="100" rx="8" fill="#1c1815" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
      <circle cx="28" cy="28" r="14" fill="rgba(126,143,118,0.2)"/>
      <text x="28" y="33" font-size="12" text-anchor="middle">🤝</text>
      <text x="16" y="60" font-family="'Outfit', sans-serif" font-size="11" font-weight="bold" fill="#f8f3ea">Custom Sourcing</text>
      <text x="16" y="74" font-family="'Outfit', sans-serif" font-size="8.5" fill="#aaa39b">Direct supplier auditing</text>
      <text x="16" y="87" font-family="'Outfit', sans-serif" font-size="8.5" font-weight="bold" fill="#7e8f76">Verified Partners</text>
    </g>
  </g>
</svg>
