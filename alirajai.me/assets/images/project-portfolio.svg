<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="folio-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141418" />
      <stop offset="50%" stop-color="#0f0f13" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="gold-pure" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5e1a4" />
      <stop offset="50%" stop-color="#d4af67" />
      <stop offset="100%" stop-color="#a86443" />
    </linearGradient>
    <filter id="shadow-folio" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="400" fill="url(#folio-bg)" rx="16"/>
  <rect x="1" y="1" width="598" height="398" fill="none" stroke="rgba(212,175,103,0.22)" stroke-width="1.5" rx="15"/>

  <!-- Code / Wireframe Accents -->
  <g opacity="0.12" stroke="#d4af67" stroke-width="0.8">
    <path d="M 50 180 L 15 200 L 50 220" fill="none"/>
    <path d="M 550 180 L 585 200 L 550 220" fill="none"/>
    <line x1="320" y1="160" x2="280" y2="240"/>
  </g>

  <!-- Browser Frame -->
  <g filter="url(#shadow-folio)" transform="translate(45, 35)">
    <!-- Window Frame -->
    <rect width="510" height="330" rx="12" fill="#111116" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    
    <!-- Window Bar -->
    <rect width="510" height="36" rx="12" fill="#181820"/>
    <rect y="24" width="510" height="12" fill="#181820"/>
    <circle cx="20" cy="18" r="4.5" fill="#ff5f56"/>
    <circle cx="34" cy="18" r="4.5" fill="#ffbd2e"/>
    <circle cx="48" cy="18" r="4.5" fill="#27c93f"/>

    <!-- URL Bar -->
    <rect x="75" y="8" width="230" height="20" rx="10" fill="#09090c" stroke="rgba(212,175,103,0.3)" stroke-width="0.8"/>
    <text x="96" y="22" font-family="'Outfit', sans-serif" font-size="10" fill="#aaa39b">https://alirajai.me</text>
    <circle cx="86" cy="18" r="3" fill="#27c93f"/>

    <!-- Bespoke Badge -->
    <g transform="translate(375, 8)">
      <rect width="120" height="20" rx="10" fill="rgba(212,175,103,0.12)" stroke="url(#gold-pure)" stroke-width="1"/>
      <circle cx="12" cy="10" r="3" fill="#d4af67"/>
      <text x="22" y="14" font-family="'Outfit', sans-serif" font-size="9" font-weight="bold" fill="#f8f3ea" letter-spacing="0.5">DARK LUXURY UI</text>
    </g>

    <!-- Header inside Mockup -->
    <g transform="translate(25, 52)">
      <circle cx="8" cy="8" r="8" fill="url(#gold-pure)"/>
      <text x="22" y="13" font-family="'Outfit', sans-serif" font-size="12" font-weight="bold" fill="#f8f3ea">Ali Rajai</text>
      
      <g transform="translate(250, 4)" fill="#aaa39b" font-family="'Outfit', sans-serif" font-size="9">
        <text x="0" y="8">About</text>
        <text x="50" y="8">Selected Works</text>
        <text x="140" y="8">Contact</text>
      </g>
    </g>

    <!-- Glassmorphic Hero Preview inside Mockup -->
    <rect x="25" y="80" width="460" height="115" rx="8" fill="rgba(255,255,255,0.04)" stroke="rgba(212,175,103,0.2)" stroke-width="1"/>
    
    <g transform="translate(45, 105)">
      <text x="0" y="16" font-family="'Outfit', sans-serif" font-size="8.5" font-weight="bold" fill="#d4af67" letter-spacing="1.5">SOFTWARE ENGINEER &amp; DEVELOPER</text>
      <text x="0" y="42" font-family="'Playfair Display', serif" font-size="17" font-weight="bold" fill="#f8f3ea">Interactive Motion &amp; Clean Architecture</text>
      <text x="0" y="58" font-family="'Outfit', sans-serif" font-size="9.5" fill="#aaa39b">Bespoke single-page website with GSAP 3D ScrollTrigger &amp; CSS glassmorphism</text>
      
      <g transform="translate(0, 68)">
        <rect width="105" height="22" rx="11" fill="url(#gold-pure)"/>
        <text x="52" y="15" font-family="'Outfit', sans-serif" font-size="9" font-weight="bold" fill="#111" text-anchor="middle">Explore Motion →</text>
      </g>
    </g>

    <!-- Tech Stack Pill Highlights -->
    <g transform="translate(25, 210)">
      <rect width="140" height="100" rx="8" fill="#181822" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
      <circle cx="28" cy="28" r="14" fill="rgba(212,175,103,0.15)"/>
      <text x="28" y="33" font-size="12" text-anchor="middle">⚡</text>
      <text x="16" y="60" font-family="'Outfit', sans-serif" font-size="11" font-weight="bold" fill="#f8f3ea">GSAP 3D Motion</text>
      <text x="16" y="74" font-family="'Outfit', sans-serif" font-size="8.5" fill="#aaa39b">ScrollTrigger physics</text>
      <text x="16" y="87" font-family="'Outfit', sans-serif" font-size="8.5" font-weight="bold" fill="#d4af67">60 FPS Smooth</text>
    </g>

    <g transform="translate(185, 210)">
      <rect width="140" height="100" rx="8" fill="#181822" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
      <circle cx="28" cy="28" r="14" fill="rgba(126,143,118,0.2)"/>
      <text x="28" y="33" font-size="12" text-anchor="middle">💎</text>
      <text x="16" y="60" font-family="'Outfit', sans-serif" font-size="11" font-weight="bold" fill="#f8f3ea">Glassmorphism</text>
      <text x="16" y="74" font-family="'Outfit', sans-serif" font-size="8.5" fill="#aaa39b">Luxury dark aesthetic</text>
      <text x="16" y="87" font-family="'Outfit', sans-serif" font-size="8.5" font-weight="bold" fill="#7e8f76">Responsive</text>
    </g>

    <g transform="translate(345, 210)">
      <rect width="140" height="100" rx="8" fill="#181822" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
      <circle cx="28" cy="28" r="14" fill="rgba(168,100,67,0.2)"/>
      <text x="28" y="33" font-size="12" text-anchor="middle">🎯</text>
      <text x="16" y="60" font-family="'Outfit', sans-serif" font-size="11" font-weight="bold" fill="#f8f3ea">Pure Vanilla Stack</text>
      <text x="16" y="74" font-family="'Outfit', sans-serif" font-size="8.5" fill="#aaa39b">Zero framework bloat</text>
      <text x="16" y="87" font-family="'Outfit', sans-serif" font-size="8.5" font-weight="bold" fill="#d4af67">Upload Ready</text>
    </g>
  </g>
</svg>
