<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f4dfaa" />
      <stop offset="50%" stop-color="#d4af67" />
      <stop offset="100%" stop-color="#a86443" />
    </linearGradient>
    <linearGradient id="dark-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1c24" />
      <stop offset="100%" stop-color="#0d0d10" />
    </linearGradient>
  </defs>

  <!-- Background Frame -->
  <rect width="100%" height="100%" fill="url(#dark-glow)" rx="16" />
  <rect x="10" y="10" width="380" height="380" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1" rx="12" />

  <!-- Tech/Grid Design Accents representing "Build / Custom UI" -->
  <g opacity="0.25">
    <line x1="40" y1="40" x2="360" y2="40" stroke="#f8f3ea" stroke-width="0.5" stroke-dasharray="4 4" />
    <line x1="40" y1="120" x2="360" y2="120" stroke="#f8f3ea" stroke-width="0.5" stroke-dasharray="1 5" />
    <line x1="40" y1="280" x2="360" y2="280" stroke="#f8f3ea" stroke-width="0.5" stroke-dasharray="1 5" />
    <line x1="40" y1="360" x2="360" y2="360" stroke="#f8f3ea" stroke-width="0.5" stroke-dasharray="4 4" />
    <line x1="40" y1="40" x2="40" y2="360" stroke="#f8f3ea" stroke-width="0.5" stroke-dasharray="4 4" />
    <line x1="120" y1="40" x2="120" y2="360" stroke="#f8f3ea" stroke-width="0.5" stroke-dasharray="1 5" />
    <line x1="280" y1="40" x2="280" y2="360" stroke="#f8f3ea" stroke-width="0.5" stroke-dasharray="1 5" />
    <line x1="360" y1="40" x2="360" y2="360" stroke="#f8f3ea" stroke-width="0.5" stroke-dasharray="4 4" />
  </g>

  <!-- Graphic representation of an elegant personal brand wireframe/mockup -->
  <!-- Browser Header Window -->
  <rect x="60" y="80" width="280" height="240" rx="8" fill="#131318" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
  <circle cx="75" cy="95" r="4" fill="#ff5f56" />
  <circle cx="87" cy="95" r="4" fill="#ffbd2e" />
  <circle cx="99" cy="95" r="4" fill="#27c93f" />
  <line x1="120" y1="95" x2="240" y2="95" stroke="rgba(255,255,255,0.1)" stroke-width="6" stroke-linecap="round" />

  <!-- Hero Text inside browser mock -->
  <rect x="80" y="130" width="130" height="12" rx="2" fill="url(#gold)" />
  <rect x="80" y="150" width="180" height="8" rx="2" fill="rgba(255,255,255,0.4)" />
  <rect x="80" y="165" width="100" height="8" rx="2" fill="rgba(255,255,255,0.2)" />

  <!-- Portfolio Grid items inside browser mock -->
  <rect x="80" y="195" width="75" height="50" rx="4" fill="rgba(255,255,255,0.05)" stroke="rgba(212,175,103,0.3)" stroke-width="1" />
  <circle cx="1175" cy="220" r="10" fill="url(#gold)" opacity="0.1" /> <!-- offset/test -->
  <rect x="88" y="232" width="40" height="4" rx="1" fill="rgba(255,255,255,0.3)" />

  <rect x="162" y="195" width="75" height="50" rx="4" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
  <rect x="170" y="232" width="40" height="4" rx="1" fill="rgba(255,255,255,0.3)" />

  <rect x="244" y="195" width="75" height="50" rx="4" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
  <rect x="252" y="232" width="40" height="4" rx="1" fill="rgba(255,255,255,0.3)" />

  <!-- Brand Signature / Initials overlay -->
  <g transform="translate(280, 260)">
    <circle cx="20" cy="20" r="24" fill="#0d0d10" stroke="url(#gold)" stroke-width="1.5" />
    <text x="20" y="26" font-family="'Playfair Display', serif" font-size="16" font-weight="bold" fill="url(#gold)" text-anchor="middle">AR</text>
  </g>
</svg>
