<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="skardu-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181c15" />
      <stop offset="50%" stop-color="#121411" />
      <stop offset="100%" stop-color="#0d0e0c" />
    </linearGradient>
    <linearGradient id="gold-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5e1a4" />
      <stop offset="50%" stop-color="#d4af67" />
      <stop offset="100%" stop-color="#a86443" />
    </linearGradient>
    <linearGradient id="sage-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7e8f76" />
      <stop offset="100%" stop-color="#3c4738" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="600" height="400" fill="url(#skardu-bg)" rx="16"/>
  <rect x="1" y="1" width="598" height="398" fill="none" stroke="rgba(212,175,103,0.18)" stroke-width="1.5" rx="15"/>

  <!-- Subtle Mountain Silhouette (Himalayan / Skardu heritage) -->
  <path d="M 0 320 L 110 240 L 190 280 L 310 180 L 420 270 L 510 210 L 600 290 L 600 400 L 0 400 Z" fill="rgba(126,143,118,0.06)"/>
  <path d="M 40 340 L 180 230 L 290 290 L 390 200 L 490 270 L 600 220 L 600 400 L 0 400 Z" fill="rgba(212,175,103,0.04)"/>

  <!-- Browser / Storefront Frame -->
  <g filter="url(#shadow)" transform="translate(45, 35)">
    <!-- Main Window -->
    <rect width="510" height="330" rx="12" fill="#141513" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    
    <!-- Window Bar -->
    <rect width="510" height="36" rx="12" fill="#1b1c19"/>
    <rect y="24" width="510" height="12" fill="#1b1c19"/>
    <circle cx="20" cy="18" r="4.5" fill="#ff5f56"/>
    <circle cx="34" cy="18" r="4.5" fill="#ffbd2e"/>
    <circle cx="48" cy="18" r="4.5" fill="#27c93f"/>

    <!-- URL Bar -->
    <rect x="75" y="8" width="260" height="20" rx="10" fill="#0d0e0c" stroke="rgba(212,175,103,0.2)" stroke-width="0.8"/>
    <text x="100" y="22" font-family="'Outfit', sans-serif" font-size="10" fill="#aaa39b">https://skardufruits.com</text>
    <circle cx="88" cy="18" r="3" fill="#27c93f"/>

    <!-- Live Store Badge -->
    <g transform="translate(400, 8)">
      <rect width="95" height="20" rx="10" fill="rgba(126,143,118,0.2)" stroke="#7e8f76" stroke-width="1"/>
      <circle cx="12" cy="10" r="3" fill="#7e8f76"/>
      <text x="24" y="14" font-family="'Outfit', sans-serif" font-size="9" font-weight="bold" fill="#f8f3ea" letter-spacing="0.5">LIVE STORE</text>
    </g>

    <!-- Storefront Navigation inside Mockup -->
    <rect x="25" y="52" width="110" height="14" rx="3" fill="url(#gold-amber)"/>
    <text x="28" y="63" font-family="'Playfair Display', serif" font-size="11" font-weight="bold" fill="#0d0e0c">SKARDU FRUITS</text>
    
    <g transform="translate(160, 56)" fill="#aaa39b" font-family="'Outfit', sans-serif" font-size="9">
      <text x="0" y="8">Organic Dry Fruits</text>
      <text x="95" y="8">Pure Shilajit</text>
      <text x="165" y="8">Wild Honey</text>
    </g>

    <!-- Cart / Bag Icon Mock -->
    <g transform="translate(460, 52)">
      <circle cx="10" cy="8" r="12" fill="rgba(212,175,103,0.15)"/>
      <text x="10" y="12" font-family="'Outfit', sans-serif" font-size="10" fill="#d4af67" text-anchor="middle">🛍️</text>
    </g>

    <!-- Hero Banner inside Storefront Mock -->
    <rect x="25" y="80" width="460" height="110" rx="8" fill="url(#sage-glow)" opacity="0.35"/>
    <rect x="25" y="80" width="460" height="110" rx="8" fill="none" stroke="rgba(212,175,103,0.25)" stroke-width="1"/>
    
    <text x="45" y="112" font-family="'Playfair Display', serif" font-size="16" font-weight="bold" fill="#f8f3ea">100% Pure Organic Dry Fruits</text>
    <text x="45" y="130" font-family="'Outfit', sans-serif" font-size="10" fill="#f4dfaa">Direct From The Valleys of Skardu, Gilgit-Baltistan</text>
    
    <g transform="translate(45, 145)">
      <rect width="90" height="24" rx="12" fill="url(#gold-amber)"/>
      <text x="45" y="16" font-family="'Outfit', sans-serif" font-size="9" font-weight="bold" fill="#111" text-anchor="middle">SHOP NOW →</text>
    </g>

    <!-- Product Grid Preview Cards -->
    <!-- Product 1: Skardu Walnuts -->
    <g transform="translate(25, 205)">
      <rect width="140" height="105" rx="6" fill="#1b1c18" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
      <rect x="10" y="10" width="120" height="50" rx="4" fill="rgba(212,175,103,0.1)"/>
      <text x="70" y="40" font-size="20" text-anchor="middle">🌰</text>
      <text x="10" y="74" font-family="'Outfit', sans-serif" font-size="10" font-weight="bold" fill="#f8f3ea">Kaghzi Walnuts</text>
      <text x="10" y="88" font-family="'Outfit', sans-serif" font-size="9" fill="#d4af67">PKR 1,850</text>
    </g>

    <!-- Product 2: Dried Apricots -->
    <g transform="translate(185, 205)">
      <rect width="140" height="105" rx="6" fill="#1b1c18" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
      <rect x="10" y="10" width="120" height="50" rx="4" fill="rgba(168,100,67,0.15)"/>
      <text x="70" y="40" font-size="20" text-anchor="middle">🍑</text>
      <text x="10" y="74" font-family="'Outfit', sans-serif" font-size="10" font-weight="bold" fill="#f8f3ea">Organic Apricots</text>
      <text x="10" y="88" font-family="'Outfit', sans-serif" font-size="9" fill="#d4af67">PKR 1,200</text>
    </g>

    <!-- Product 3: Salajeet / Shilajit -->
    <g transform="translate(345, 205)">
      <rect width="140" height="105" rx="6" fill="#1b1c18" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
      <rect x="10" y="10" width="120" height="50" rx="4" fill="rgba(126,143,118,0.15)"/>
      <text x="70" y="40" font-size="20" text-anchor="middle">🏔️</text>
      <text x="10" y="74" font-family="'Outfit', sans-serif" font-size="10" font-weight="bold" fill="#f8f3ea">Himalayan Shilajit</text>
      <text x="10" y="88" font-family="'Outfit', sans-serif" font-size="9" fill="#d4af67">PKR 2,900</text>
    </g>
  </g>
</svg>
